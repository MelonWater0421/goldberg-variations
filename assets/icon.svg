<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Goldberg Variations BWV 988 Emblem">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172036"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
  <!-- Mirror Axis -->
  <line x1="10" y1="26" x2="54" y2="26" stroke="#475569" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <!-- Canon Leader & Mirror Follower -->
  <path d="M12 22 C20 14, 28 30, 38 17 C44 12, 49 20, 52 18" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M16 30 C24 38, 32 22, 42 35 C47 39, 50 32, 52 34" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- 8 Ground Bass Pillars -->
  <g fill="#34d399" opacity="0.9">
    <rect x="12" y="42" width="3.5" height="6" rx="1"/>
    <rect x="17.2" y="43" width="3.5" height="5" rx="1"/>
    <rect x="22.4" y="44" width="3.5" height="4" rx="1"/>
    <rect x="27.6" y="45" width="3.5" height="3" rx="1"/>
    <rect x="32.8" y="46" width="3.5" height="2" rx="1"/>
    <rect x="38.0" y="45" width="3.5" height="3" rx="1"/>
    <rect x="43.2" y="44" width="3.5" height="4" rx="1"/>
    <rect x="48.4" y="42" width="3.5" height="6" rx="1"/>
  </g>
  <text x="32" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="9.5" font-weight="700" letter-spacing="0.9" fill="#f8fafc">BWV 988</text>
</svg>
